  <meta charset="UTF-8" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Calendrier de vos tâches." />
  <link rel="icon" type="image/svg+xml" href="../assets/logo/logo-t.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../assets/css/style2.css?v=28" />
  <script src="../assets/js/transitions.js?v=28"></script>
  <script src="../assets/js/i18n.js?v=28"></script>
  <script>
    // Garde d'authentification
    if (!sessionStorage.getItem("auth")) {
      window.location.replace("./login.html");
    }
  </script>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#080808">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !location.pathname.includes('/src/')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(err => console.error('Service Worker Error:', err));
      });
    }
  </script>
  <script src="../assets/js/runtime.js?v=28"></script>
  <script src="../assets/js/dialogs.js?v=28"></script>
  <link rel="stylesheet" href="../assets/css/interface.css?v=28">
  <link rel="stylesheet" href="../assets/css/pages.css?v=28">
</head>

<body class="interface-v6 calendar-page">
  <a class="skip-link" href="#main-content">Aller au contenu</a>

  <!-- ── Header ── -->
<header class="site-header"><div class="site-header-inner"><a class="workspace-brand" href="./app.html"><span class="brand-mark" aria-hidden="true">T</span><span data-i18n="app_title">To-Do List</span></a><p class="site-session"><span data-i18n="space_of">Espace de</span> <strong id="user-label"></strong></p><nav class="nav-links site-header-actions" aria-label="Navigation principale"><a class="site-link" href="app.html" id="back-btn" data-i18n="back_to_app">← Retour aux tâches</a></nav></div></header>
<header class="section-heading"><p class="ui-eyebrow" data-i18n="workspace_label">Mon espace</p><h1 data-i18n="calendar_title">Calendrier</h1><p data-i18n="calendar_overview">Vue d’ensemble</p></header>

  <!-- ── Contenu principal ── -->
  <main class="container" id="main-content">
    <div class="calendar-page-content">
      <div class="calendar-view-toggles" style="margin-bottom: 2rem;">
        <button id="calendar-view-grid" class="calendar-view-btn active" data-i18n="view_month" title="Vue Mois">Mois</button>
        <button id="calendar-view-planning" class="calendar-view-btn" data-i18n="view_planning" title="Vue Planning">Planning</button>
      </div>

      <div id="calendar-grid-container">
        <div class="calendar-header">
          <button id="calendar-prev" class="calendar-nav" data-i18n-aria="prev_month" aria-label="Mois précédent">◀</button>
          <h2 class="modal-heading" id="calendar-heading" style="margin: 0; font-size: 1.2rem;">Mois</h2>
          <button id="calendar-next" class="calendar-nav" data-i18n-aria="next_month" aria-label="Mois suivant">▶</button>
        </div>
        <div class="calendar-weekdays" style="font-size: 0.8rem; margin-bottom: 1rem;">
          <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
        </div>
        <div id="calendar-grid" class="calendar-grid" style="gap: 4px;">
          <!-- Les jours seront générés par JavaScript -->
        </div>
      </div>

      <div id="calendar-planning-container" style="display: none;">
        <div id="calendar-planning-list" class="calendar-planning-list" style="max-height: none;">
          <!-- La liste chronologique sera générée par JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <footer class="footer site-footer">
    <div class="footer-links">
      <a href="../index.html">Accueil</a>

      <a href="./cgu.html">CGU</a>
      <a href="./donnees.html">Gestion des données</a>
    </div>
    <p>© 2026 · Sacha G.</p>
  </footer>

  <script src="../assets/js/crypto.js?v=28"></script>
  <script src="../assets/js/task-store.js?v=28"></script>
  <script src="../assets/js/timeout.js?v=28"></script>
  <script src="../assets/js/calendar.js?v=28"></script>
</body>

</html>
